name: Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure guard.sh is executed from base branch on PR
        if: github.event_name == 'pull_request'
        run: |
          git checkout "origin/${{ github.base_ref }}" -- scripts/guard.sh || true

      - name: Forbidden files, personal-data patterns, red paths
        run: bash scripts/guard.sh

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gl.tgz
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks detect --source . --redact --no-banner --verbose
